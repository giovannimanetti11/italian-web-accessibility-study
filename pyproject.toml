[project]
name = "iwass"
version = "0.1.0"
description = "Reproducible large-scale measurement of automatically detectable WCAG barriers on the Italian web"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1,<9",
    "defusedxml>=0.7,<1",
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
    "rich>=13.9,<15",
    "tldextract>=5.1,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
